name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Check version was incremented
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          PREVIOUS=$(git show HEAD~1:app/build.gradle.kts | grep 'versionName' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Previous version: $PREVIOUS"
          echo "Current version:  $CURRENT"
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "::error::Version number has not been incremented ($CURRENT). Bump the version before pushing to main."
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists. Version number must be unique."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG="${{ steps.version.outputs.version }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          mv "$APK" "app/build/outputs/apk/release/OpenKIS_Android_${TAG}.apk"

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: OpenKIS Android ${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/OpenKIS_Android_${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
