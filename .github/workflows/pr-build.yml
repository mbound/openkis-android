name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose Piemonte HTTP access
        shell: bash
        run: |
          set +e
          probe() {
            label="$1"
            url="$2"
            ua="$3"
            echo
            echo "===== $label ====="
            echo "URL: $url"
            if [ -n "$ua" ]; then
              curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -A "$ua" "$url"
            else
              curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body "$url"
            fi
            code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c}' /tmp/headers)
            echo "HTTP: $code"
            echo "--- headers ---"
            sed -n '1,40p' /tmp/headers
            echo "--- body prefix ---"
            head -c 500 /tmp/body | tr '\n' ' '
            echo
          }

          for host in catastogrotte-piemonte.net dev.catastogrotte-piemonte.net; do
            if [[ "$host" == dev.* ]]; then
              path="/export/cavita-naturali/csv"
            else
              path="/openkis_json.php?mod=caves"
            fi
            url="https://$host$path"
            probe "$host / curl default" "$url" ""
            probe "$host / OkHttp UA" "$url" "okhttp/4.12.0"
            probe "$host / Android app UA" "$url" "OpenKIS-Android/1.3.8"
            probe "$host / Browser UA" "$url" "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"
          done

