name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Inspect APK install metadata
        run: |
          echo "=== signing report ==="
          ./gradlew signingReport
          echo "=== APK manifest ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20 || true
          echo "=== APK signature ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload CF test APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenKIS-CF-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
