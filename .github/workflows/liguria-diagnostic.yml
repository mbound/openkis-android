name: Liguria API diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Liguria entity endpoints
        shell: bash
        run: |
          set +e
          base="https://www.catastogrotte.net/liguria"
          for mod in caves springs artificials; do
            for api in openkis_json.php openkis_API.php; do
              url="$base/$api?mod=$mod"
              echo "===== $url ====="
              code=$(curl -sS -L --max-time 60 -o /tmp/body -w "%{http_code}" "$url")
              echo "HTTP $code bytes=$(wc -c < /tmp/body)"
              head -c 220 /tmp/body | tr '\n' ' '; echo
              if [ "$code" = "200" ]; then
                python3 - <<'PY'
import json
raw=open("/tmp/body","rb").read()
try:
    d=json.loads(raw)
    print("json_type", type(d).__name__)
    if isinstance(d,dict):
        items=d.get("items")
        print("keys", list(d)[:12], "items", len(items) if isinstance(items,list) else None, "count", d.get("count"))
        if isinstance(items,list) and items:
            print("first_keys", list(items[0])[:30])
except Exception as e:
    print("json_error", repr(e))
PY
              fi
            done
          done

          echo "===== public caves CSV ====="
          code=$(curl -sS -L --max-time 60 -D /tmp/h -o /tmp/csv -w "%{http_code}" "$base/it/caves/?export=1")
          echo "HTTP $code bytes=$(wc -c < /tmp/csv) lines=$(wc -l < /tmp/csv)"
          grep -iE '^(content-type|content-disposition):' /tmp/h | tail -10 || true
          head -3 /tmp/csv | cut -c1-900
